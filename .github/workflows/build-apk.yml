name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MoneyMan-1.0.0.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMan-apk
          path: dist/MoneyMan-1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MoneyMan v1.0.0
          body: |
            MoneyMan — Track every Money. Own your money.

            A fully offline, privacy-first personal finance app built with Flutter.

            **Install**
            1. Download `MoneyMan-1.0.0.apk` below.
            2. Allow "Install unknown apps" for your browser/file manager.
            3. Open the file and install.

            Debug-signed release build — intended for direct sideloading, not the Play Store.
          files: dist/MoneyMan-1.0.0.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
